description = "List CRM tasks Arguments: --limit <number>."
prompt = """
# List Tasks

List CRM tasks from all boards.

## Arguments
Format: `[--limit <number>]`
- --limit: Number of tasks to return (default: 50)

Parse from "{{args}}".

## Process

1. **List tasks:**
   ```
   crm_tasks_list(limit=<limit>, offset=0)
   ```

2. **Display as table:**
   - Task name
   - Status/step
   - Due date
   - ID

## Example Usage
```
/list-tasks
/list-tasks --limit 20
```

## Notes
- Shows tasks from all boards
- Default limit is 50"""
